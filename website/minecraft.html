<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Tu regalo de Minecraft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="style.css?v=4">
</head>

<body>
    <div class="page">
        <marquee class="marquee" behavior="scroll" direction="left">
            ¡Tu regalo es un regreso al fantástico mundo de Minecraft!
            <img src="assets/nodrugs.gif" alt="¡No te drogues!" class="feature-image" height="10px">
        </marquee>

        <div class="card">
            <div class="birthday-header">
                <h1>¡Tu regalo es Minecraft!</h1>
            </div>

            <p class="message">Conéctate a tu servidor de Minecraft usando esta dirección:</p>

            <p class="message"><code class="server-ip">{{ip_address}}</code></p>

            <div class="computer-gif">
                <img src="assets/computer.gif" alt="Minecraft" class="computer-image">
            </div>

            <div class="image-container">
                <img src="assets/minecraft.png" alt="Minecraft" class="feature-image">
            </div>

            <div class="gift">
                <a href="/index.html" class="gift-link">
                    <span class="gift-text">Volver a la página principal</span>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
